<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="The ink-on-white spine of the system" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-text); }
  .row { display: flex; padding: 16px; gap: 0; }
  .sw { flex: 1; display: flex; flex-direction: column; }
  .chip { height: 78px; }
  .meta { padding: 8px 2px 0; }
  .name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .hex { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#EAEAEA"></div><div class="meta"><div class="name">Gray 100</div><div class="hex">#EAEAEA</div></div></div>
  <div class="sw"><div class="chip" style="background:#D9D9D9"></div><div class="meta"><div class="name">Gray 200</div><div class="hex">#D9D9D9</div></div></div>
  <div class="sw"><div class="chip" style="background:#909090"></div><div class="meta"><div class="name">Muted</div><div class="hex">#909090</div></div></div>
  <div class="sw"><div class="chip" style="background:#494949"></div><div class="meta"><div class="name">Gray 600 · body</div><div class="hex">#494949</div></div></div>
  <div class="sw"><div class="chip" style="background:#1F1F20"></div><div class="meta"><div class="name">Gray 900 · ink</div><div class="hex">#1F1F20</div></div></div>
</div>
</body></html>
