<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-text); }
  .wrap { padding: 22px 24px; display: flex; align-items: flex-end; gap: 14px; }
  .u { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent); width: 100%; }
  .box { display: flex; align-items: flex-end; height: 84px; }
  .n { font-size: 12px; color: var(--text-muted); }
</style></head>
<body>
<div class="wrap">
  <div class="u"><div class="box"><div class="bar" style="width:4px;height:4px"></div></div><div class="n">4</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:8px;height:8px"></div></div><div class="n">8</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:12px;height:12px"></div></div><div class="n">12</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:16px;height:16px"></div></div><div class="n">16</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:20px;height:20px"></div></div><div class="n">20</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:24px;height:24px"></div></div><div class="n">24</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:32px;height:32px"></div></div><div class="n">32</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:40px;height:40px"></div></div><div class="n">40</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:48px;height:48px"></div></div><div class="n">48</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:64px;height:64px"></div></div><div class="n">64</div></div>
  <div class="u"><div class="box"><div class="bar" style="width:80px;height:80px"></div></div><div class="n">80</div></div>
</div>
</body></html>
