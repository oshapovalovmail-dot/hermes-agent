<!-- @dsCard group="Brand" name="Референсы стиля" subtitle="Воздушные светлые слайды + интерфейсные элементы (Правило 24)" viewport="1200x760" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Референсы стиля</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1f1f20;
    font-family: "YS Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 56px;
  }
  .head { max-width: 760px; margin: 0 0 40px; }
  .kicker {
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #9a9a9c;
    margin: 0 0 14px;
  }
  h1 {
    font-family: "YS Display Cond", "YS Text", sans-serif;
    font-weight: 900;
    font-size: 56px;
    line-height: 0.89;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }
  .lede { font-size: 20px; line-height: 1.35; color: #5c5c5e; margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  figure { margin: 0; }
  .shot {
    border-radius: 18px;
    overflow: hidden;
    background: #f2f2f2;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 18px 40px -24px rgba(0,0,0,0.22);
  }
  .shot img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 14px; font-size: 16px; line-height: 1.3; color: #5c5c5e; }
  figcaption b { color: #1f1f20; font-weight: 500; }
</style>
</head>
<body>
  <div class="head">
    <p class="kicker">Правило 24 · референсы</p>
    <h1>Воздушные светлые слайды</h1>
    <p class="lede">Берём приёмы, не контент: воздух, светлый фон, точечный акцент и аккуратные интерфейсные элементы (pill-кнопки, иконочные кнопки в круге, карточки с крупным скруглением, метки-теги, контраст масштабов).</p>
  </div>
  <div class="grid">
    <figure>
      <div class="shot"><img src="ref-bioidea-airy-interface.png" alt="Референс: воздушная вёрстка с интерфейсными элементами" /></div>
      <figcaption><b>Воздух + UI-детали.</b> Pill-чипы, иконочные кнопки, превью с таймкодом, крупный заголовок.</figcaption>
    </figure>
    <figure>
      <div class="shot"><img src="ref-drp-light-cards.png" alt="Референс: светлые карточки на белом фоне" /></div>
      <figcaption><b>Светлые карточки.</b> Белый фон, крупная цифра-герой, теги, акцент изображением.</figcaption>
    </figure>
    <figure>
      <div class="shot"><img src="ref-liverooms-pastel-cards.png" alt="Референс: пастельные карточки" /></div>
      <figcaption><b>Пастельный акцент.</b> Одна цветная плашка среди белого, скругления, спокойная типографика.</figcaption>
    </figure>
  </div>
</body>
</html>
