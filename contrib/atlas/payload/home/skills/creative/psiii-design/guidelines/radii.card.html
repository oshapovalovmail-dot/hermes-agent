<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Mostly sharp — round only for marks & pills" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-text); }
  .wrap { padding: 22px 24px; display: flex; gap: 28px; align-items: flex-end; }
  .u { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 78px; height: 78px; background: var(--gray-100); box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .n { font-size: 12px; color: var(--text-muted); text-align: center; }
  .n b { display: block; color: var(--text-primary); font-weight: 500; }
</style></head>
<body>
<div class="wrap">
  <div class="u"><div class="box" style="border-radius:0"></div><div class="n"><b>0</b>default</div></div>
  <div class="u"><div class="box" style="border-radius:8px"></div><div class="n"><b>8</b>chips</div></div>
  <div class="u"><div class="box" style="border-radius:16px"></div><div class="n"><b>16</b>cards</div></div>
  <div class="u"><div class="box" style="border-radius:28px"></div><div class="n"><b>28</b>panels</div></div>
  <div class="u"><div class="box" style="border-radius:999px"></div><div class="n"><b>full</b>marks · pills</div></div>
</div>
</body></html>
