<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-text); }
  .row { display: flex; padding: 16px; gap: 16px; }
  .sw { flex: 1; display: flex; flex-direction: column; }
  .chip { height: 78px; border-radius: 2px; }
  .meta { padding: 8px 2px 0; }
  .name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .hex { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFA787"></div><div class="meta"><div class="name">Peach</div><div class="hex">#FFA787</div></div></div>
  <div class="sw"><div class="chip" style="background:#ADD2E6"></div><div class="meta"><div class="name">Sky</div><div class="hex">#ADD2E6</div></div></div>
</div>
</body></html>
