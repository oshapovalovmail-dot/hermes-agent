<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Презентация ПСиИИ — шаблон</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  .wrap { min-height: 100vh; box-sizing: border-box; background: var(--white); font-family: var(--font-text);
    display: flex; flex-direction: column; justify-content: space-between; padding: 64px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .mark { width: 56px; height: 56px; }
  .kick { font-size: 22px; color: #909090; letter-spacing: .02em; }
  .title { font-family: var(--font-display); font-weight: 900; font-size: 120px; line-height: 0.85;
    letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .meta { display: flex; gap: 32px; align-items: center; margin-top: 28px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 999px;
    background: var(--gray-900); color: #fff; font-weight: 500; font-size: 19px; text-decoration: none; }
  .note { font-size: 19px; color: #494949; max-width: 760px; line-height: 1.3; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; }
  .file { font-size: 17px; color: #909090; }
</style>
</head>
<body>
<div class="wrap">

  </div>
